name: lol_coach
description: League of Legends in-game item coach powered by AI

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  msix: ^3.16.13
  stream_channel: any
  very_good_analysis: ^5.1.0
flutter:
  uses-material-design: true

msix_config:
  display_name: LoL Coach
  publisher_display_name: NexusHero
  identity_name: NexusHero.LoLCoach
  msix_version: 1.0.0.0
  description: League of Legends in-game item coach powered by AI
  # To bundle the bridge, msix uses build/windows/x64/runner/Release as source.
  # Our build script will copy bridge.exe there before calling msix:create.
