name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Bridge (Node.js / TypeScript) ─────────────────────────────────────────
  bridge:
    name: Bridge — Node.js
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bridge

      - name: Run tests
        run: npm test
        working-directory: bridge

  # ── Flutter app (Dart) ────────────────────────────────────────────────────
  flutter:
    name: Flutter app — Dart
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Analyze
        run: flutter analyze
        working-directory: flutter_app

      - name: Run tests
        run: flutter test
        working-directory: flutter_app
