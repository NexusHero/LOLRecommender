name: Docs

on:
  push:
    branches: [master, main]

jobs:
  typedoc:
    name: Generate TypeDoc
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bridge

      - name: Generate TypeDoc
        run: npm run docs
        working-directory: bridge

      - name: Upload TypeDoc artifact
        uses: actions/upload-artifact@v7
        with:
          name: typedoc
          path: bridge/docs/
          retention-days: 30

  asyncapi:
    name: Validate AsyncAPI spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Validate asyncapi.yml
        uses: asyncapi/cli@v6.0.0
        with:
          command: validate
          filepath: bridge/asyncapi.yml
