name: Build and Release Multi-Platform Installers

on:
  push:
    tags:
      - 'v*' # Trigger this workflow only when a version tag is pushed (e.g. v1.0.0)
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Installer
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for Bridge)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bridge Dependencies
        run: |
          cd bridge
          npm ci

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Flutter Desktop
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: .\build_installer.ps1
        shell: powershell

      - name: Build Unix (Mac/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x ./build_unix.sh
          ./build_unix.sh
        shell: bash

      - name: Upload Windows Asset
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LoLCoach.msix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Asset
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LoLCoach-Mac.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Asset
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LoLCoach-Linux.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
