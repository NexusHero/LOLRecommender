name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*' # Trigger this workflow only when a version tag is pushed (e.g. v1.0.0)
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # Needed to upload the release asset

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for Bridge)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bridge Dependencies
        run: |
          cd bridge
          npm install

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Flutter Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Run Build Script (Bridge + Flutter + Inno Setup)
        run: .\build_installer.ps1
        shell: powershell

      - name: Upload Installer to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LoLCoach-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
