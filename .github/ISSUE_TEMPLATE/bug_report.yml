name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much as you can — it speeds up the fix.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - core (Node.js)
        - Flutter app
        - Both
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start core with `npm run dev`
        2. Enter a game as ...
        3. ...

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      render: shell

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14 / Windows 11 / Ubuntu 22.04"

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "e.g. 20.11.0"

  - type: input
    id: flutter
    attributes:
      label: Flutter version
      placeholder: "e.g. 3.44.1"

  - type: dropdown
    id: llm
    attributes:
      label: LLM provider in use
      options:
        - None (heuristic only)
        - Claude
        - OpenAI
        - Gemini

